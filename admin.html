<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz Admin</title>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#0d2735;
padding:30px;
border-radius:24px;
}

h1{
text-align:center;
font-size:50px;
margin-bottom:30px;
}

input,
select{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#102c3d;
color:white;
font-size:18px;
margin-bottom:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.success{
margin-top:20px;
text-align:center;
font-size:20px;
color:#00c853;
}

.questionCard{
background:#102c3d;
padding:20px;
border-radius:18px;
margin-top:20px;
}

.answer{
margin-top:10px;
padding:10px;
background:#16384d;
border-radius:12px;
}

.correct{
background:#00c853;
color:#051622;
font-weight:bold;
}

.previewImage{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:16px;
margin-top:15px;
margin-bottom:15px;
}

.actionButtons{
display:flex;
gap:15px;
margin-top:20px;
}

.editBtn{
background:#ffc107;
}

.deleteBtn{
background:#ff5252;
color:white;
}

.smallInput{
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
TS Quiz Admin
</h1>

<input id="category" placeholder="Categoría">

<input id="image" placeholder="URL de imagen">

<input id="video" placeholder="URL YouTube">

<input id="question" placeholder="Pregunta">

<input id="answer1" placeholder="Respuesta 1">

<input id="answer2" placeholder="Respuesta 2">

<input id="answer3" placeholder="Respuesta 3">

<input id="answer4" placeholder="Respuesta 4">

<select id="correct">

<option value="0">
Respuesta correcta: 1
</option>

<option value="1">
Respuesta correcta: 2
</option>

<option value="2">
Respuesta correcta: 3
</option>

<option value="3">
Respuesta correcta: 4
</option>

</select>

<input
id="time"
type="number"
class="smallInput"
placeholder="Tiempo en segundos"
value="15">

<button onclick="saveQuestion()">
💾 GUARDAR PREGUNTA
</button>

<div
id="success"
class="success">
</div>

</div>

<h2 style="margin-top:40px;">
📚 Preguntas guardadas
</h2>

<div id="questionsList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
remove,
update
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBzMS3vAgZbvDpMoKGbALPcBl_oBIayDfc",

authDomain: "ts-quiz-live.firebaseapp.com",

databaseURL: "https://ts-quiz-live-default-rtdb.firebaseio.com",

projectId: "ts-quiz-live",

storageBucket: "ts-quiz-live.firebasestorage.app",

messagingSenderId: "1008762047515",

appId: "1:1008762047515:web:d848a84da0ef965ce1fcbe",

measurementId: "G-MZENY9GPQ7"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

let editingId = null;

window.saveQuestion = function(){

const category =
document.getElementById("category").value;

const image =
document.getElementById("image").value;

const video =
document.getElementById("video").value;

const question =
document.getElementById("question").value;

const answer1 =
document.getElementById("answer1").value;

const answer2 =
document.getElementById("answer2").value;

const answer3 =
document.getElementById("answer3").value;

const answer4 =
document.getElementById("answer4").value;

const correct =
parseInt(
document.getElementById("correct").value
);

const time =
parseInt(
document.getElementById("time").value
) || 15;

if(question.trim() === ""){

alert("Escribe una pregunta");

return;

}

const payload = {

category:category,

image:image,

video:video,

question:question,

answers:[
answer1,
answer2,
answer3,
answer4
],

correct:correct,

time:time

};

if(editingId){

update(
ref(db,'questions/' + editingId),
payload
);

editingId = null;

document.getElementById("success")
.innerHTML =
"✏️ Pregunta actualizada";

}else{

const questionRef =
push(ref(db,'questions'));

set(questionRef,payload);

document.getElementById("success")
.innerHTML =
"✅ Pregunta guardada";

}

clearForm();

}

function clearForm(){

document.getElementById("category").value = "";

document.getElementById("image").value = "";

document.getElementById("video").value = "";

document.getElementById("question").value = "";

document.getElementById("answer1").value = "";

document.getElementById("answer2").value = "";

document.getElementById("answer3").value = "";

document.getElementById("answer4").value = "";

document.getElementById("correct").value = "0";

document.getElementById("time").value = "15";

}

window.deleteQuestion = function(id){

const confirmDelete =
confirm("¿Eliminar esta pregunta?");

if(!confirmDelete) return;

remove(ref(db,'questions/' + id));

}

window.editQuestion = function(id,data){

editingId = id;

document.getElementById("category").value =
data.category || "";

document.getElementById("image").value =
data.image || "";

document.getElementById("video").value =
data.video || "";

document.getElementById("question").value =
data.question || "";

document.getElementById("answer1").value =
data.answers[0] || "";

document.getElementById("answer2").value =
data.answers[1] || "";

document.getElementById("answer3").value =
data.answers[2] || "";

document.getElementById("answer4").value =
data.answers[3] || "";

document.getElementById("correct").value =
data.correct || 0;

document.getElementById("time").value =
data.time || 15;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

const questionsRef =
ref(db,'questions');

onValue(questionsRef,(snapshot)=>{

const data = snapshot.val();

const list =
document.getElementById("questionsList");

list.innerHTML = "";

if(data){

Object.entries(data)
.reverse()
.forEach(([id,question])=>{

let answersHTML = "";

question.answers.forEach((answer,index)=>{

let className = "answer";

if(index === question.correct){

className += " correct";

}

answersHTML +=
`
<div class="${className}">
${answer}
</div>
`;

});

let imageHTML = "";

if(question.image){

imageHTML =
`
<img
src="${question.image}"
class="previewImage">
`;

}

let videoHTML = "";

if(question.video){

videoHTML =
`
<div style="
margin-top:15px;
padding:12px;
background:#16384d;
border-radius:12px;
word-break:break-all;
">
🎬 ${question.video}
</div>
`;

}

list.innerHTML +=
`
<div class="questionCard">

${imageHTML}

${videoHTML}

<h3>
${question.question}
</h3>

<div style="margin-top:10px;">
📚 ${question.category || "Sin categoría"}
</div>

<div style="margin-top:10px;">
⏱️ ${question.time || 15} segundos
</div>

${answersHTML}

<div class="actionButtons">

<button
class="editBtn"
onclick='editQuestion(
"${id}",
${JSON.stringify(question)}
)'>
✏️ EDITAR
</button>

<button
class="deleteBtn"
onclick='deleteQuestion("${id}")'>
🗑️ ELIMINAR
</button>

</div>

</div>
`;

});

}

});

</script>

</body>

</html>
