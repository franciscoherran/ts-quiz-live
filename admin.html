<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz Admin PRO</title>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#0d2735;
padding:30px;
border-radius:24px;
}

h1{
text-align:center;
font-size:50px;
margin-bottom:30px;
}

input,
select{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#102c3d;
color:white;
font-size:18px;
margin-bottom:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

.success{
margin-top:20px;
text-align:center;
font-size:20px;
color:#00c853;
}

.questionCard{
background:#102c3d;
padding:20px;
border-radius:18px;
margin-top:20px;
animation:fade 0.4s;
}

.answer{
margin-top:10px;
padding:10px;
background:#16384d;
border-radius:12px;
}

.correct{
background:#00c853;
color:#051622;
font-weight:bold;
}

.previewImage{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:16px;
margin-top:15px;
margin-bottom:15px;
}

.previewVideo{
width:100%;
height:300px;
border:none;
border-radius:16px;
margin-top:15px;
margin-bottom:15px;
}

.badge{
display:inline-block;
padding:8px 14px;
border-radius:12px;
font-size:14px;
font-weight:bold;
margin-right:10px;
margin-top:10px;
}

.easy{
background:#00c853;
color:#051622;
}

.medium{
background:#ffd600;
color:#051622;
}

.hard{
background:#ff5252;
}

.actions{
display:flex;
gap:10px;
margin-top:20px;
}

.deleteBtn{
background:#ff5252;
color:white;
}

.editBtn{
background:#ffd54f;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
TS Quiz Admin PRO
</h1>

<input
id="category"
placeholder="Categoría">

<select id="difficulty">

<option value="Fácil">
Fácil
</option>

<option value="Media">
Media
</option>

<option value="Difícil">
Difícil
</option>

</select>

<input
id="time"
type="number"
placeholder="Tiempo en segundos"
value="15">

<input
id="image"
placeholder="URL de imagen">

<input
id="video"
placeholder="URL video embed YouTube">

<input
id="question"
placeholder="Pregunta">

<input
id="answer1"
placeholder="Respuesta 1">

<input
id="answer2"
placeholder="Respuesta 2">

<input
id="answer3"
placeholder="Respuesta 3">

<input
id="answer4"
placeholder="Respuesta 4">

<select id="correct">

<option value="0">
Respuesta correcta: 1
</option>

<option value="1">
Respuesta correcta: 2
</option>

<option value="2">
Respuesta correcta: 3
</option>

<option value="3">
Respuesta correcta: 4
</option>

</select>

<button onclick="saveQuestion()">
💾 GUARDAR PREGUNTA
</button>

<div
id="success"
class="success">
</div>

</div>

<h2 style="margin-top:40px;">
📚 Preguntas guardadas
</h2>

<div id="questionsList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
remove,
update
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBzMS3vAgZbvDpMoKGbALPcBl_oBIayDfc",

authDomain: "ts-quiz-live.firebaseapp.com",

databaseURL: "https://ts-quiz-live-default-rtdb.firebaseio.com",

projectId: "ts-quiz-live",

storageBucket: "ts-quiz-live.firebasestorage.app",

messagingSenderId: "1008762047515",

appId: "1:1008762047515:web:d848a84da0ef965ce1fcbe",

measurementId: "G-MZENY9GPQ7"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

window.editingId = null;

window.saveQuestion = function(){

const category =
document.getElementById("category").value;

const difficulty =
document.getElementById("difficulty").value;

const time =
parseInt(
document.getElementById("time").value
);

const image =
document.getElementById("image").value;

const video =
document.getElementById("video").value;

const question =
document.getElementById("question").value;

const answer1 =
document.getElementById("answer1").value;

const answer2 =
document.getElementById("answer2").value;

const answer3 =
document.getElementById("answer3").value;

const answer4 =
document.getElementById("answer4").value;

const correct =
parseInt(
document.getElementById("correct").value
);

if(question.trim() === ""){

alert("Escribe una pregunta");

return;

}

const questionData = {

category:category,

difficulty:difficulty,

time:time,

image:image,

video:video,

question:question,

answers:[
answer1,
answer2,
answer3,
answer4
],

correct:correct

};

if(window.editingId){

update(
ref(
db,
'questions/' + window.editingId
),
questionData
);

document.getElementById("success")
.innerHTML =
"✅ Pregunta actualizada";

window.editingId = null;

}else{

const questionRef =
push(ref(db,'questions'));

set(questionRef,questionData);

document.getElementById("success")
.innerHTML =
"✅ Pregunta guardada";

}

clearForm();

}

function clearForm(){

document.getElementById("category").value = "";
document.getElementById("difficulty").value = "Fácil";
document.getElementById("time").value = 15;
document.getElementById("image").value = "";
document.getElementById("video").value = "";
document.getElementById("question").value = "";
document.getElementById("answer1").value = "";
document.getElementById("answer2").value = "";
document.getElementById("answer3").value = "";
document.getElementById("answer4").value = "";
document.getElementById("correct").value = 0;

}

window.deleteQuestion = function(id){

const confirmDelete =
confirm(
"¿Eliminar esta pregunta?"
);

if(!confirmDelete) return;

remove(
ref(db,'questions/' + id)
);

}

window.editQuestion = function(id){

const question =
questionsCache[id];

document.getElementById("category")
.value =
question.category || "";

document.getElementById("difficulty")
.value =
question.difficulty || "Fácil";

document.getElementById("time")
.value =
question.time || 15;

document.getElementById("image")
.value =
question.image || "";

document.getElementById("video")
.value =
question.video || "";

document.getElementById("question")
.value =
question.question || "";

document.getElementById("answer1")
.value =
question.answers[0] || "";

document.getElementById("answer2")
.value =
question.answers[1] || "";

document.getElementById("answer3")
.value =
question.answers[2] || "";

document.getElementById("answer4")
.value =
question.answers[3] || "";

document.getElementById("correct")
.value =
question.correct;

window.editingId = id;

window.scrollTo({
top:0,
behavior:"smooth"
});

document.getElementById("success")
.innerHTML =
"✏️ Editando pregunta";

}

let questionsCache = {};

const questionsRef =
ref(db,'questions');

onValue(questionsRef,(snapshot)=>{

const data = snapshot.val();

questionsCache = data || {};

const list =
document.getElementById("questionsList");

list.innerHTML = "";

if(data){

Object.entries(data)
.reverse()
.forEach(([id,question])=>{

let answersHTML = "";

question.answers.forEach((answer,index)=>{

let className = "answer";

if(index === question.correct){

className += " correct";

}

answersHTML +=
`
<div class="${className}">
${answer}
</div>
`;

});

let imageHTML = "";

if(question.image){

imageHTML =
`
<img
src="${question.image}"
class="previewImage">
`;

}

let videoHTML = "";

if(question.video){

videoHTML =
`
<iframe
src="${question.video}"
class="previewVideo"
allowfullscreen>
</iframe>
`;

}

let difficultyClass = "easy";

if(question.difficulty === "Media"){
difficultyClass = "medium";
}

if(question.difficulty === "Difícil"){
difficultyClass = "hard";
}

list.innerHTML +=
`
<div class="questionCard">

${imageHTML}

${videoHTML}

<h3>
${question.question}
</h3>

<div style="margin-top:10px;">

<span class="badge ${difficultyClass}">
${question.difficulty || "Fácil"}
</span>

<span class="badge">
📚 ${question.category || "General"}
</span>

<span class="badge">
⏱️ ${question.time || 15}s
</span>

</div>

${answersHTML}

<div class="actions">

<button
class="editBtn"
onclick="editQuestion('${id}')">

✏️ EDITAR

</button>

<button
class="deleteBtn"
onclick="deleteQuestion('${id}')">

🗑️ ELIMINAR

</button>

</div>

</div>
`;

});

}

});

</script>

</body>

</html>
