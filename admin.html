<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz Admin</title>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
padding:30px;
}

.container{
max-width:800px;
margin:auto;
}

.card{
background:#0d2735;
padding:30px;
border-radius:24px;
}

h1{
text-align:center;
font-size:50px;
margin-bottom:30px;
}

input,select{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#102c3d;
color:white;
font-size:18px;
margin-bottom:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.success{
margin-top:20px;
text-align:center;
font-size:20px;
color:#00c853;
}

.questionCard{
background:#102c3d;
padding:20px;
border-radius:18px;
margin-top:20px;
}

.answer{
margin-top:10px;
padding:10px;
background:#16384d;
border-radius:12px;
}

.correct{
background:#00c853;
color:#051622;
font-weight:bold;
}

.previewImage{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:16px;
margin-top:15px;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
TS Quiz Admin
</h1>

<input id="category" placeholder="Categoría">

<input id="image" placeholder="URL de imagen">

<input id="question" placeholder="Pregunta">

<input id="answer1" placeholder="Respuesta 1">

<input id="answer2" placeholder="Respuesta 2">

<input id="answer3" placeholder="Respuesta 3">

<input id="answer4" placeholder="Respuesta 4">

<select id="correct">

<option value="0">
Respuesta correcta: 1
</option>

<option value="1">
Respuesta correcta: 2
</option>

<option value="2">
Respuesta correcta: 3
</option>

<option value="3">
Respuesta correcta: 4
</option>

</select>

<button onclick="saveQuestion()">
GUARDAR PREGUNTA
</button>

<div
id="success"
class="success">
</div>

</div>

<h2 style="margin-top:40px;">
Preguntas guardadas
</h2>

<div id="questionsList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBzMS3vAgZbvDpMoKGbALPcBl_oBIayDfc",

authDomain: "ts-quiz-live.firebaseapp.com",

databaseURL: "https://ts-quiz-live-default-rtdb.firebaseio.com",

projectId: "ts-quiz-live",

storageBucket: "ts-quiz-live.firebasestorage.app",

messagingSenderId: "1008762047515",

appId: "1:1008762047515:web:d848a84da0ef965ce1fcbe",

measurementId: "G-MZENY9GPQ7"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

window.saveQuestion = function(){

const category =
document.getElementById("category").value;

const image =
document.getElementById("image").value;

const question =
document.getElementById("question").value;

const answer1 =
document.getElementById("answer1").value;

const answer2 =
document.getElementById("answer2").value;

const answer3 =
document.getElementById("answer3").value;

const answer4 =
document.getElementById("answer4").value;

const correct =
parseInt(
document.getElementById("correct").value
);

if(question.trim() === ""){

alert("Escribe pregunta");

return;

}

const questionRef =
push(ref(db,'questions'));

set(questionRef,{

category:category,

image:image,

question:question,

answers:[
answer1,
answer2,
answer3,
answer4
],

correct:correct

});

document.getElementById("success")
.innerHTML =
"✅ Pregunta guardada";

document.getElementById("question").value = "";
document.getElementById("image").value = "";
document.getElementById("answer1").value = "";
document.getElementById("answer2").value = "";
document.getElementById("answer3").value = "";
document.getElementById("answer4").value = "";

}

const questionsRef =
ref(db,'questions');

onValue(questionsRef,(snapshot)=>{

const data = snapshot.val();

const list =
document.getElementById("questionsList");

list.innerHTML = "";

if(data){

Object.values(data).reverse().forEach(question=>{

let answersHTML = "";

question.answers.forEach((answer,index)=>{

let className = "answer";

if(index === question.correct){

className += " correct";

}

answersHTML +=
`
<div class="${className}">
${answer}
</div>
`;

});

let imageHTML = "";

if(question.image){

imageHTML =
`
<img
src="${question.image}"
class="previewImage">
`;

}

list.innerHTML +=
`
<div class="questionCard">

${imageHTML}

<h3>
${question.question}
</h3>

<div>
📚 ${question.category}
</div>

${answersHTML}

</div>
`;

});

}

});

</script>

</body>

</html>
