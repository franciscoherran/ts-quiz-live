<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz Play PRO</title>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#0d2735;
padding:25px;
border-radius:24px;
margin-top:20px;
animation:fade 0.5s;
}

input,select{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#102c3d;
color:white;
font-size:20px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
transition:0.2s;
cursor:pointer;
}

button:hover{
transform:scale(1.02);
}

#questionImage{
width:100%;
max-height:320px;
object-fit:cover;
border-radius:20px;
margin-bottom:20px;
display:none;
animation:fade 0.5s;
}

.question{
font-size:30px;
text-align:center;
margin-bottom:25px;
animation:fade 0.5s;
}

.answerBtn{
margin-top:15px;
background:#16384d;
color:white;
}

.answerBtn:hover{
background:#1f4c66;
}

.timer{
margin-top:20px;
text-align:center;
font-size:70px;
font-weight:bold;
color:#03b2ff;
transition:0.3s;
}

.timerPulse{
transform:scale(1.15);
color:#ff5252;
}

.waiting{
text-align:center;
font-size:30px;
margin-top:40px;
color:#88cbe7;
}

.success{
background:#00c853 !important;
color:#051622 !important;
}

.playerName{
text-align:center;
font-size:28px;
margin-top:20px;
color:#03b2ff;
font-weight:bold;
}

.teamBadge{
display:inline-block;
padding:8px 18px;
border-radius:20px;
margin-top:10px;
font-size:18px;
font-weight:bold;
}

.teamAzul{
background:#2196f3;
}

.teamRojo{
background:#ff5252;
}

.teamVerde{
background:#00c853;
}

.teamAmarillo{
background:#ffd600;
color:#051622;
}

@keyframes fade{
from{
opacity:0;
}
to{
opacity:1;
}
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 style="text-align:center;font-size:50px;">
TS Quiz PRO
</h1>

<input
id="roomCode"
placeholder="Código de sala">

<input
id="playerName"
placeholder="Tu nombre">

<select id="team">

<option value="Azul">
🔵 Equipo Azul
</option>

<option value="Rojo">
🔴 Equipo Rojo
</option>

<option value="Verde">
🟢 Equipo Verde
</option>

<option value="Amarillo">
🟡 Equipo Amarillo
</option>

</select>

<button onclick="joinRoom()">
ENTRAR
</button>

</div>

<div
id="gameArea"
style="display:none;">

<div class="playerName" id="playerDisplay">
Jugador
</div>

<div
id="teamDisplay"
style="text-align:center;">
</div>

<div class="timer" id="timer">
15
</div>

<div class="card">

<img
id="questionImage"
src="">

<div
id="question"
class="question">
Esperando pregunta...
</div>

<div id="answers"></div>

</div>

</div>

<div
id="waiting"
class="waiting">
Esperando juego...
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBzMS3vAgZbvDpMoKGbALPcBl_oBIayDfc",

authDomain: "ts-quiz-live.firebaseapp.com",

databaseURL: "https://ts-quiz-live-default-rtdb.firebaseio.com",

projectId: "ts-quiz-live",

storageBucket: "ts-quiz-live.firebasestorage.app",

messagingSenderId: "1008762047515",

appId: "1:1008762047515:web:d848a84da0ef965ce1fcbe",

measurementId: "G-MZENY9GPQ7"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

let currentRoom = "";
let currentPlayer = "";
let currentTeam = "";
let answered = false;

const urlParams =
new URLSearchParams(window.location.search);

const roomFromURL =
urlParams.get("room");

if(roomFromURL){

document.getElementById("roomCode")
.value = roomFromURL;

}

window.joinRoom = function(){

const code =
document.getElementById("roomCode")
.value;

const name =
document.getElementById("playerName")
.value;

const team =
document.getElementById("team")
.value;

if(code.trim() === "" || name.trim() === ""){

alert("Completa datos");

return;

}

currentRoom = code;
currentPlayer = name;
currentTeam = team;

const playerRef =
push(
ref(
db,
'rooms/' + code + '/players'
)
);

set(playerRef,{
name:name,
team:team,
score:0
});

document.getElementById("gameArea")
.style.display = "block";

document.getElementById("waiting")
.style.display = "none";

document.getElementById("playerDisplay")
.innerHTML =
"👤 " + name;

let teamClass = "";

if(team === "Azul"){
teamClass = "teamAzul";
}

if(team === "Rojo"){
teamClass = "teamRojo";
}

if(team === "Verde"){
teamClass = "teamVerde";
}

if(team === "Amarillo"){
teamClass = "teamAmarillo";
}

document.getElementById("teamDisplay")
.innerHTML =
`
<div class="teamBadge ${teamClass}">
${team}
</div>
`;

listenGame();
listenTimer();

}

function listenGame(){

const gameRef =
ref(
db,
'rooms/' +
currentRoom +
'/game'
);

onValue(gameRef,(snapshot)=>{

const data = snapshot.val();

if(data){

answered = false;

document.getElementById("question")
.innerHTML =
data.question;

if(data.image){

document.getElementById("questionImage")
.style.display = "block";

document.getElementById("questionImage")
.src = data.image;

}else{

document.getElementById("questionImage")
.style.display = "none";

}

const answers =
document.getElementById("answers");

answers.innerHTML = "";

data.answers.forEach((answer,index)=>{

answers.innerHTML +=
`
<button
class="answerBtn"
onclick="sendAnswer(${index},this)">
${answer}
</button>
`;

});

}

});

}

function listenTimer(){

const timerRef =
ref(
db,
'rooms/' +
currentRoom +
'/timer'
);

onValue(timerRef,(snapshot)=>{

const data = snapshot.val();

if(data){

document.getElementById("timer")
.innerHTML =
data.time;

if(data.time <= 5){

document.getElementById("timer")
.classList.add("timerPulse");

}else{

document.getElementById("timer")
.classList.remove("timerPulse");

}

if(!data.active){

disableButtons();

}

}

});

}

window.sendAnswer = function(answer,button){

if(answered) return;

answered = true;

button.classList.add("success");

const responseRef =
push(
ref(
db,
'rooms/' +
currentRoom +
'/responses'
)
);

set(responseRef,{
player:currentPlayer,
team:currentTeam,
answer:answer
});

disableButtons();

}

function disableButtons(){

const buttons =
document.querySelectorAll(".answerBtn");

buttons.forEach(button=>{

button.disabled = true;

button.style.opacity = 0.6;

});

}

</script>

</body>

</html>
