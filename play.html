<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Quiz Player</title>

<style>
body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#0d2735;
padding:25px;
border-radius:24px;
margin-top:20px;
}

input,select{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#102c3d;
color:white;
font-size:20px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.answerBtn{
background:#16384d;
color:white;
}

.success{
background:#00c853 !important;
color:#051622 !important;
}

#questionImage{
width:100%;
max-height:320px;
object-fit:cover;
border-radius:20px;
margin-bottom:20px;
display:none;
}

#questionVideo{
display:none;
margin-bottom:20px;
border-radius:20px;
border:none;
}

.question{
font-size:30px;
text-align:center;
margin-bottom:25px;
}

.timer{
margin-top:20px;
text-align:center;
font-size:70px;
font-weight:bold;
color:#03b2ff;
}
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 style="text-align:center;font-size:50px;">
TS Quiz PRO
</h1>

<input id="roomCode" placeholder="Código de sala">
<input id="playerName" placeholder="Tu nombre">

<select id="team">
<option value="Azul">🔵 Equipo Azul</option>
<option value="Rojo">🔴 Equipo Rojo</option>
<option value="Verde">🟢 Equipo Verde</option>
<option value="Amarillo">🟡 Equipo Amarillo</option>
</select>

<button onclick="joinRoom()">
ENTRAR
</button>

</div>

<div id="gameArea" style="display:none;">

<div class="timer" id="timer">15</div>

<div class="card">

<img id="questionImage" src="">

<iframe
id="questionVideo"
width="100%"
height="260"
allowfullscreen>
</iframe>

<div id="question" class="question">
Esperando pregunta...
</div>

<div id="answers"></div>

</div>

</div>

</div>

<script type="module">

import { db }
from "./scripts/firebase.js";

import {
ref,
set,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

let currentRoom = "";
let currentPlayer = "";
let currentTeam = "";
let answered = false;

window.joinRoom = function(){

const code =
document.getElementById("roomCode")
.value;

const name =
document.getElementById("playerName")
.value;

const team =
document.getElementById("team")
.value;

currentRoom = code;
currentPlayer = name;
currentTeam = team;

const playerRef =
push(
ref(
db,
'rooms/' + code + '/players'
)
);

set(playerRef,{
name:name,
team:team,
score:0,
correct:0,
wrong:0
});

document.getElementById("gameArea")
.style.display = "block";

listenGame();
listenTimer();

}

function listenGame(){

const gameRef =
ref(
db,
'rooms/' + currentRoom + '/game'
);

onValue(gameRef,(snapshot)=>{

const data = snapshot.val();

if(data){

answered = false;

document.getElementById("question")
.innerHTML = data.question;

if(data.image){

document.getElementById("questionImage")
.style.display = "block";

document.getElementById("questionImage")
.src = data.image;

}else{

document.getElementById("questionImage")
.style.display = "none";

}

if(data.video){

document.getElementById("questionVideo")
.style.display = "block";

document.getElementById("questionVideo")
.src = data.video;

}else{

document.getElementById("questionVideo")
.style.display = "none";

document.getElementById("questionVideo")
.src = "";

}

const answers =
document.getElementById("answers");

answers.innerHTML = "";

data.answers.forEach((answer,index)=>{

answers.innerHTML +=
`
<button
class="answerBtn"
onclick="sendAnswer(${index},this)">
${answer}
</button>
`;

});

}

});

}

function listenTimer(){

const timerRef =
ref(
db,
'rooms/' + currentRoom + '/timer'
);

onValue(timerRef,(snapshot)=>{

const data = snapshot.val();

if(data){

document.getElementById("timer")
.innerHTML = data.time;

if(!data.active){
disableButtons();
}

}

});

}

window.sendAnswer = function(answer,button){

if(answered) return;

answered = true;

button.classList.add("success");

const responseRef =
push(
ref(
db,
'rooms/' + currentRoom + '/responses'
)
);

set(responseRef,{
player:currentPlayer,
team:currentTeam,
answer:answer,
timeLeft:parseInt(
document.getElementById("timer").innerHTML
)
});

disableButtons();

}

function disableButtons(){

const buttons =
document.querySelectorAll(".answerBtn");

buttons.forEach(button=>{
button.disabled = true;
button.style.opacity = 0.6;
});

}

</script>

</body>
</html>
