<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
overflow-x:hidden;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.card{
background:#0d2735;
padding:30px;
border-radius:24px;
margin-top:30px;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.roomCode{
font-size:80px;
text-align:center;
font-weight:bold;
color:#03b2ff;
margin-top:20px;
}

#qrcode{
display:flex;
justify-content:center;
margin-top:25px;
}

.joinText{
text-align:center;
margin-top:20px;
font-size:24px;
color:#88cbe7;
}

.player{
background:#102c3d;
padding:15px;
border-radius:14px;
margin-bottom:10px;
font-size:20px;
}

#questionImage{
width:100%;
max-height:420px;
object-fit:cover;
border-radius:24px;
margin-top:30px;
display:none;
}

#questionBox{
margin-top:30px;
background:#102c3d;
padding:25px;
border-radius:20px;
font-size:30px;
text-align:center;
}

.answer{
background:#16384d;
padding:15px;
border-radius:14px;
margin-top:12px;
font-size:22px;
}

.correct{
background:#00c853 !important;
}

.counter{
margin-top:25px;
font-size:28px;
text-align:center;
color:#03b2ff;
font-weight:bold;
}

.leader{
background:#102c3d;
padding:18px;
border-radius:16px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
font-size:22px;
}

.timerBox{
margin-top:25px;
text-align:center;
font-size:90px;
font-weight:bold;
color:#03b2ff;
}

.timeBar{
width:100%;
height:20px;
background:#102c3d;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.timeFill{
height:100%;
width:100%;
background:#03b2ff;
transition:1s linear;
}

</style>

</head>

<body>

<div class="container">

<h1 style="text-align:center;font-size:60px;">
TS Quiz PRO MAX
</h1>

<div class="card">

<button onclick="createRoom()">
🎮 CREAR SALA
</button>

<div id="roomArea" style="display:none;">

<div class="roomCode" id="roomCode">
000000
</div>

<div class="joinText">
Escanea para entrar al juego
</div>

<div id="qrcode"></div>

<h2 style="margin-top:40px;">
👥 Jugadores conectados
</h2>

<div id="playersList"></div>

<button
id="startGameBtn"
onclick="startGame()"
style="
background:#00c853;
font-size:28px;
">

▶️ INICIAR JUEGO

</button>

<div id="timer" class="timerBox">15</div>

<div class="timeBar">
<div id="timeFill" class="timeFill"></div>
</div>

<img id="questionImage" src="">

<div id="questionBox">
Esperando inicio del juego...
</div>

<div id="answersBox"></div>

<div id="responseCounter" class="counter">
0 respuestas
</div>

<button onclick="nextQuestion()">
➡️ SIGUIENTE PREGUNTA
</button>

<h2>🏅 Leaderboard</h2>

<div id="leaderboard"></div>

</div>

</div>

</div>

</body>

</html>
