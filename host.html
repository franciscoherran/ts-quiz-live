<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz Host</title>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

.card{
background:#0d2735;
padding:30px;
border-radius:24px;
margin-top:30px;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
cursor:pointer;
}

.roomCode{
font-size:80px;
text-align:center;
font-weight:bold;
color:#03b2ff;
margin:30px 0;
}

.player{
background:#102c3d;
padding:15px;
border-radius:14px;
margin-bottom:10px;
font-size:20px;
}

#questionBox{
margin-top:30px;
background:#102c3d;
padding:25px;
border-radius:20px;
font-size:28px;
text-align:center;
}

.answer{
background:#16384d;
padding:15px;
border-radius:14px;
margin-top:12px;
font-size:20px;
}

.correct{
background:#00c853 !important;
}

.counter{
margin-top:25px;
font-size:28px;
text-align:center;
color:#03b2ff;
font-weight:bold;
}

.leader{
background:#102c3d;
padding:18px;
border-radius:16px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
font-size:22px;
}

.timerBox{
margin-top:25px;
text-align:center;
font-size:70px;
font-weight:bold;
color:#03b2ff;
}

.timeBar{
width:100%;
height:20px;
background:#102c3d;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.timeFill{
height:100%;
width:100%;
background:#03b2ff;
transition:1s linear;
}

</style>

</head>

<body>

<div class="container">

<h1 style="text-align:center;font-size:60px;">
TS Quiz Host
</h1>

<div class="card">

<button onclick="createRoom()">
CREAR SALA
</button>

<div id="roomArea" style="display:none;">

<div class="roomCode" id="roomCode">
000000
</div>

<h2>
Jugadores conectados
</h2>

<div id="playersList"></div>

<button onclick="nextQuestion()">
SIGUIENTE PREGUNTA
</button>

<div class="timerBox">
<span id="timer">
15
</span>
</div>

<div class="timeBar">
<div
id="timeFill"
class="timeFill">
</div>
</div>

<div id="questionBox">
Pregunta aparecerá aquí
</div>

<div id="answersBox"></div>

<div
id="responseCounter"
class="counter">
0 respuestas
</div>

<h2>
Leaderboard
</h2>

<div id="leaderboard"></div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
remove,
onValue,
get,
update
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBzMS3vAgZbvDpMoKGbALPcBl_oBIayDfc",

authDomain: "ts-quiz-live.firebaseapp.com",

databaseURL: "https://ts-quiz-live-default-rtdb.firebaseio.com",

projectId: "ts-quiz-live",

storageBucket: "ts-quiz-live.firebasestorage.app",

messagingSenderId: "1008762047515",

appId: "1:1008762047515:web:d848a84da0ef965ce1fcbe",

measurementId: "G-MZENY9GPQ7"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const questions = [

{
question:"¿Quién construyó el arca?",
answers:[
"Noé",
"Moisés",
"David",
"Pedro"
],
correct:0
},

{
question:"¿Quién derrotó a Goliat?",
answers:[
"David",
"Pablo",
"Juan",
"Samuel"
],
correct:0
},

{
question:"¿Cuántos días ayunó Jesús?",
answers:[
"7",
"14",
"40",
"50"
],
correct:2
}

];

let currentQuestion = 0;
let currentRoom = "";
let timer = 15;
let interval;

window.createRoom = function(){

const code =
Math.floor(100000 + Math.random() * 900000)
.toString();

currentRoom = code;

set(ref(db,'rooms/' + code),{
active:true
});

document.getElementById("roomArea")
.style.display = "block";

document.getElementById("roomCode")
.innerHTML = code;

listenPlayers(code);

listenResponses(code);

showQuestion();

}

function startTimer(){

clearInterval(interval);

timer = 15;

document.getElementById("timer")
.innerHTML = timer;

document.getElementById("timeFill")
.style.width = "100%";

set(
ref(db,'rooms/' + currentRoom + '/timer'),
{
time:timer,
active:true
}
);

interval = setInterval(()=>{

timer--;

document.getElementById("timer")
.innerHTML = timer;

const percent =
(timer / 15) * 100;

document.getElementById("timeFill")
.style.width =
percent + "%";

set(
ref(db,'rooms/' + currentRoom + '/timer'),
{
time:timer,
active:true
}
);

if(timer <= 0){

clearInterval(interval);

set(
ref(db,'rooms/' + currentRoom + '/timer'),
{
time:0,
active:false
}
);

}

},1000);

}

function listenPlayers(code){

const playersRef =
ref(db,'rooms/' + code + '/players');

onValue(playersRef,(snapshot)=>{

const data = snapshot.val();

const list =
document.getElementById("playersList");

list.innerHTML = "";

if(data){

Object.entries(data).forEach(([id,player])=>{

list.innerHTML +=
`
<div class="player">
👤 ${player.name} — ${player.score || 0} pts
</div>
`;

});

showLeaderboard(data);

}

});

}

function showQuestion(){

remove(
ref(
db,
'rooms/' +
currentRoom +
'/responses'
)
);

const q =
questions[currentQuestion];

document.getElementById("questionBox")
.innerHTML =
q.question;

const answersBox =
document.getElementById("answersBox");

answersBox.innerHTML = "";

q.answers.forEach((answer,index)=>{

let className = "answer";

if(index === q.correct){

className += " correct";

}

answersBox.innerHTML +=
`
<div class="${className}">
${answer}
</div>
`;

});

set(
ref(
db,
'rooms/' +
currentRoom +
'/game'
),
q
);

startTimer();

}

window.nextQuestion = function(){

currentQuestion++;

if(currentQuestion >= questions.length){

currentQuestion = 0;

}

showQuestion();

}

function listenResponses(code){

const responsesRef =
ref(db,'rooms/' + code + '/responses');

onValue(responsesRef,async(snapshot)=>{

const data = snapshot.val();

let total = 0;

if(data){

const playersSnap =
await get(
ref(db,'rooms/' + code + '/players')
);

const players =
playersSnap.val();

Object.values(data).forEach(response=>{

total++;

const q =
questions[currentQuestion];

if(response.answer === q.correct){

Object.entries(players).forEach(([id,player])=>{

if(player.name === response.player){

update(
ref(
db,
'rooms/' +
code +
'/players/' +
id
),
{
score:(player.score || 0) + 100
}
);

}

});

}

});

}

document.getElementById("responseCounter")
.innerHTML =
total + " respuestas";

});

}

function showLeaderboard(players){

const leaderboard =
document.getElementById("leaderboard");

leaderboard.innerHTML = "";

const sorted =
Object.values(players)
.sort((a,b)=>
(b.score || 0) - (a.score || 0)
);

sorted.slice(0,5).forEach((player,index)=>{

leaderboard.innerHTML +=
`
<div class="leader">

<div>
${index + 1}. 👤 ${player.name}
</div>

<div>
${player.score || 0} pts
</div>

</div>
`;

});

}

</script>

</body>

</html>
