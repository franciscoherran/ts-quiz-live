<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
overflow-x:hidden;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.card{
background:#0d2735;
padding:30px;
border-radius:24px;
margin-top:30px;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

.roomCode{
font-size:80px;
text-align:center;
font-weight:bold;
color:#03b2ff;
margin-top:20px;
}

#qrcode{
display:flex;
justify-content:center;
margin-top:25px;
}

.joinText{
text-align:center;
margin-top:20px;
font-size:24px;
color:#88cbe7;
}

.player{
background:#102c3d;
padding:15px;
border-radius:14px;
margin-bottom:10px;
font-size:20px;
}

#questionImage{
width:100%;
max-height:420px;
object-fit:cover;
border-radius:24px;
margin-top:30px;
display:none;
}

#questionBox{
margin-top:30px;
background:#102c3d;
padding:25px;
border-radius:20px;
font-size:30px;
text-align:center;
}

.answer{
background:#16384d;
padding:15px;
border-radius:14px;
margin-top:12px;
font-size:22px;
}

.correct{
background:#00c853 !important;
}

.timerBox{
margin-top:25px;
text-align:center;
font-size:90px;
font-weight:bold;
color:#03b2ff;
}

.timeBar{
width:100%;
height:20px;
background:#102c3d;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.timeFill{
height:100%;
background:#03b2ff;
width:100%;
transition:1s linear;
}

.leader{
background:#102c3d;
padding:18px;
border-radius:16px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
font-size:22px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="container">

<h1 style="text-align:center;font-size:60px;">
TS Quiz PRO MAX
</h1>

<div class="card">

<button onclick="createRoom()">
🎮 CREAR SALA
</button>

<div id="roomArea" class="hidden">

<div class="roomCode" id="roomCode">
000000
</div>

<div class="joinText">
Escanea para entrar al juego
</div>

<div id="qrcode"></div>

<h2 style="margin-top:40px;">
👥 Jugadores conectados
</h2>

<div id="playersList"></div>

<button
id="startBtn"
onclick="startGame()"
style="background:#00c853;">
▶️ INICIAR JUEGO
</button>

<div id="gameArea" class="hidden">

<div id="timer" class="timerBox">15</div>

<div class="timeBar">
<div id="timeFill" class="timeFill"></div>
</div>

<img id="questionImage" src="">

<div id="questionBox">
Esperando inicio del juego...
</div>

<div id="answersBox"></div>

<h2 style="margin-top:40px;">
🏆 Leaderboard
</h2>

<div id="leaderboard"></div>

</div>

</div>

</div>

</div>

<script type="module">

import { db }
from "./scripts/firebase.js";

import {
ref,
set,
get,
update,
remove,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

let questions = [];
let currentQuestion = 0;
let currentRoom = "";
let timer = 15;
let interval;

async function loadQuestions(){

try{

const snapshot =
await get(ref(db,'questions'));

const data = snapshot.val();

console.log("Preguntas Firebase:", data);

if(data){

questions =
Object.values(data);

console.log(
"Preguntas cargadas:",
questions
);

}else{

questions = [];

alert(
"No hay preguntas creadas en admin.html"
);

}

}catch(error){

console.error(error);

alert(
"Error cargando preguntas"
);

}

}

loadQuestions();

window.createRoom = async function(){

if(questions.length === 0){

alert(
"No hay preguntas cargadas"
);

return;

}

const code =
Math.floor(
100000 + Math.random() * 900000
).toString();

currentRoom = code;

await set(
ref(db,'rooms/' + code),
{
active:true
}
);

document.getElementById("roomArea")
.classList.remove("hidden");

document.getElementById("roomCode")
.innerHTML = code;

document.getElementById("qrcode")
.innerHTML = "";

const playURL =
window.location.origin
+
window.location.pathname.replace(
"host.html",
"play.html"
)
+
"?room=" + code;

new QRCode(
document.getElementById("qrcode"),
{
text:playURL,
width:220,
height:220
}
);

listenPlayers();

}

window.startGame = function(){

document.getElementById("startBtn")
.style.display = "none";

document.getElementById("gameArea")
.classList.remove("hidden");

currentQuestion = 0;

showQuestion();

}

function showQuestion(){

const q =
questions[currentQuestion];

if(!q){

finishGame();

return;

}

remove(
ref(
db,
'rooms/' + currentRoom + '/responses'
)
);

document.getElementById("questionBox")
.innerHTML =
q.question;

if(q.image){

document.getElementById("questionImage")
.style.display = "block";

document.getElementById("questionImage")
.src = q.image;

}else{

document.getElementById("questionImage")
.style.display = "none";

}

const answersBox =
document.getElementById("answersBox");

answersBox.innerHTML = "";

q.answers.forEach((answer,index)=>{

let className = "answer";

if(index === q.correct){

className += " correct";

}

answersBox.innerHTML +=
`
<div class="${className}">
${answer}
</div>
`;

});

set(
ref(
db,
'rooms/' + currentRoom + '/game'
),
{
question:q.question,
answers:q.answers,
correct:q.correct,
image:q.image || "",
time:q.time || 15
}
);

startTimer();

}

function startTimer(){

clearInterval(interval);

timer =
questions[currentQuestion].time || 15;

document.getElementById("timer")
.innerHTML = timer;

document.getElementById("timeFill")
.style.width = "100%";

interval = setInterval(()=>{

timer--;

document.getElementById("timer")
.innerHTML = timer;

const percent =
(timer /
(questions[currentQuestion].time || 15))
* 100;

document.getElementById("timeFill")
.style.width =
percent + "%";

set(
ref(
db,
'rooms/' + currentRoom + '/timer'
),
{
time:timer,
active:true
}
);

if(timer <= 0){

clearInterval(interval);

set(
ref(
db,
'rooms/' + currentRoom + '/timer'
),
{
time:0,
active:false
}
);

setTimeout(()=>{

nextQuestion();

},3000);

}

},1000);

}

window.nextQuestion = function(){

currentQuestion++;

if(currentQuestion >= questions.length){

finishGame();

return;

}

showQuestion();

}

function listenPlayers(){

const playersRef =
ref(
db,
'rooms/' + currentRoom + '/players'
);

onValue(playersRef,(snapshot)=>{

const data = snapshot.val();

const list =
document.getElementById("playersList");

list.innerHTML = "";

if(data){

Object.values(data).forEach((player)=>{

list.innerHTML +=
`
<div class="player">
👤 ${player.name}
- ${player.score || 0} pts
</div>
`;

});

updateLeaderboard(data);

}

});

}

function updateLeaderboard(players){

const leaderboard =
document.getElementById("leaderboard");

leaderboard.innerHTML = "";

const sorted =
Object.values(players)
.sort((a,b)=>
(b.score || 0)
-
(a.score || 0)
);

sorted.forEach((player,index)=>{

leaderboard.innerHTML +=
`
<div class="leader">

<div>
${index + 1}. ${player.name}
</div>

<div>
${player.score || 0} pts
</div>

</div>
`;

});

}

function finishGame(){

clearInterval(interval);

document.getElementById("questionBox")
.innerHTML =
"🏆 JUEGO FINALIZADO";

document.getElementById("answersBox")
.innerHTML =
`
<button
onclick="location.reload()"
style="background:#00c853;">
🔁 NUEVO JUEGO
</button>
`;

confetti({
particleCount:300,
spread:120
});

}

</script>

</body>
</html>
