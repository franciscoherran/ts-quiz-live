<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TS Quiz Host PRO</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#051622;
font-family:Arial;
color:white;
overflow-x:hidden;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

.card{
background:#0d2735;
padding:30px;
border-radius:24px;
margin-top:30px;
animation:fade 0.5s;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#03b2ff;
color:#051622;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

.roomCode{
font-size:80px;
text-align:center;
font-weight:bold;
color:#03b2ff;
margin-top:20px;
}

#qrcode{
display:flex;
justify-content:center;
margin-top:25px;
}

.joinText{
text-align:center;
margin-top:20px;
font-size:24px;
color:#88cbe7;
}

.player{
background:#102c3d;
padding:15px;
border-radius:14px;
margin-bottom:10px;
font-size:20px;
animation:slideUp 0.4s;
}

#questionImage{
width:100%;
max-height:400px;
object-fit:cover;
border-radius:24px;
margin-top:30px;
display:none;
animation:fade 0.5s;
}

#questionBox{
margin-top:30px;
background:#102c3d;
padding:25px;
border-radius:20px;
font-size:28px;
text-align:center;
animation:fade 0.5s;
}

.answer{
background:#16384d;
padding:15px;
border-radius:14px;
margin-top:12px;
font-size:20px;
animation:slideUp 0.3s;
}

.correct{
background:#00c853 !important;
}

.counter{
margin-top:25px;
font-size:28px;
text-align:center;
color:#03b2ff;
font-weight:bold;
}

.leader{
background:#102c3d;
padding:18px;
border-radius:16px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
font-size:22px;
animation:slideUp 0.4s;
}

.timerBox{
margin-top:25px;
text-align:center;
font-size:90px;
font-weight:bold;
color:#03b2ff;
transition:0.3s;
}

.timerPulse{
transform:scale(1.1);
color:#ff5252;
}

.timeBar{
width:100%;
height:20px;
background:#102c3d;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.timeFill{
height:100%;
width:100%;
background:#03b2ff;
transition:1s linear;
}

.loading{
text-align:center;
font-size:30px;
margin-top:30px;
color:#88cbe7;
}

.podiumContainer{
display:none;
margin-top:50px;
animation:fade 1s;
}

.podiumTitle{
text-align:center;
font-size:60px;
margin-bottom:40px;
}

.podium{
display:flex;
align-items:flex-end;
justify-content:center;
gap:20px;
height:420px;
}

.place{
width:200px;
border-radius:24px 24px 0 0;
padding:20px;
text-align:center;
display:flex;
flex-direction:column;
justify-content:flex-end;
animation:up 1s;
}

.first{
height:360px;
background:#ffd700;
color:#051622;
}

.second{
height:260px;
background:#c0c0c0;
color:#051622;
}

.third{
height:220px;
background:#cd7f32;
color:white;
}

.medal{
font-size:80px;
margin-bottom:20px;
}

.playerName{
font-size:32px;
font-weight:bold;
margin-bottom:15px;
}

.playerScore{
font-size:28px;
}

@keyframes fade{
from{
opacity:0;
}
to{
opacity:1;
}
}

@keyframes slideUp{
from{
transform:translateY(20px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

@keyframes up{
from{
transform:translateY(100px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

</style>

</head>

<body>

<div class="container">

<h1 style="text-align:center;font-size:60px;">
TS Quiz PRO
</h1>

<div class="card">

<button onclick="createRoom()">
CREAR SALA
</button>

<div
id="loading"
class="loading">
Cargando preguntas...
</div>

<div id="roomArea" style="display:none;">

<div class="roomCode" id="roomCode">
000000
</div>

<div class="joinText">
Escanea para entrar al juego
</div>

<div id="qrcode"></div>

<h2 style="margin-top:40px;">
Jugadores conectados
</h2>

<div id="playersList"></div>

<button onclick="nextQuestion()">
SIGUIENTE PREGUNTA
</button>

<div
id="timer"
class="timerBox">
15
</div>

<div class="timeBar">
<div
id="timeFill"
class="timeFill">
</div>
</div>

<img
id="questionImage"
src="">

<div id="questionBox">
Pregunta aparecerá aquí
</div>

<div id="answersBox"></div>

<div
id="responseCounter"
class="counter">
0 respuestas
</div>

<h2>
Leaderboard
</h2>

<div id="leaderboard"></div>

<button onclick="showPodium()">
🏆 MOSTRAR PODIUM FINAL
</button>

<div
id="podium"
class="podiumContainer">

<h2 class="podiumTitle">
🏆 PODIUM FINAL
</h2>

<div class="podium">

<div class="place second">
<div class="medal">🥈</div>
<div id="secondName" class="playerName">-</div>
<div id="secondScore" class="playerScore">0 pts</div>
</div>

<div class="place first">
<div class="medal">🥇</div>
<div id="firstName" class="playerName">-</div>
<div id="firstScore" class="playerScore">0 pts</div>
</div>

<div class="place third">
<div class="medal">🥉</div>
<div id="thirdName" class="playerName">-</div>
<div id="thirdScore" class="playerScore">0 pts</div>
</div>

</div>

</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
remove,
onValue,
get,
update
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBzMS3vAgZbvDpMoKGbALPcBl_oBIayDfc",

authDomain: "ts-quiz-live.firebaseapp.com",

databaseURL: "https://ts-quiz-live-default-rtdb.firebaseio.com",

projectId: "ts-quiz-live",

storageBucket: "ts-quiz-live.firebasestorage.app",

messagingSenderId: "1008762047515",

appId: "1:1008762047515:web:d848a84da0ef965ce1fcbe",

measurementId: "G-MZENY9GPQ7"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const tickSound =
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

const podiumSound =
new Audio(
"https://actions.google.com/sounds/v1/crowds/applause.ogg"
);

let questions = [];

let currentQuestion = 0;
let currentRoom = "";
let timer = 15;
let interval;

loadQuestions();

async function loadQuestions(){

const snapshot =
await get(ref(db,'questions'));

const data = snapshot.val();

if(data){

questions = Object.values(data);

document.getElementById("loading")
.style.display = "none";

}

}

window.createRoom = function(){

const code =
Math.floor(100000 + Math.random() * 900000)
.toString();

currentRoom = code;

set(ref(db,'rooms/' + code),{
active:true
});

document.getElementById("roomArea")
.style.display = "block";

document.getElementById("roomCode")
.innerHTML = code;

document.getElementById("qrcode")
.innerHTML = "";

const playURL =
window.location.origin +
window.location.pathname
.replace("host.html","play.html")
+ "?room=" + code;

new QRCode(
document.getElementById("qrcode"),
{
text:playURL,
width:220,
height:220
}
);

listenPlayers(code);

listenResponses(code);

showQuestion();

}

function startTimer(){

clearInterval(interval);

timer = 15;

document.getElementById("timer")
.innerHTML = timer;

document.getElementById("timeFill")
.style.width = "100%";

interval = setInterval(()=>{

timer--;

document.getElementById("timer")
.innerHTML = timer;

const percent =
(timer / 15) * 100;

document.getElementById("timeFill")
.style.width =
percent + "%";

if(timer <= 5){

document.getElementById("timer")
.classList.add("timerPulse");

tickSound.play();

}else{

document.getElementById("timer")
.classList.remove("timerPulse");

}

if(timer <= 0){

clearInterval(interval);

}

},1000);

}

function listenPlayers(code){

const playersRef =
ref(db,'rooms/' + code + '/players');

onValue(playersRef,(snapshot)=>{

const data = snapshot.val();

const list =
document.getElementById("playersList");

list.innerHTML = "";

if(data){

Object.values(data).forEach((player)=>{

list.innerHTML +=
`
<div class="player">
👤 ${player.name} — ${player.score || 0} pts
</div>
`;

});

showLeaderboard(data);

}

});

}

function showQuestion(){

remove(
ref(
db,
'rooms/' +
currentRoom +
'/responses'
)
);

const q =
questions[currentQuestion];

if(q.image){

document.getElementById("questionImage")
.style.display = "block";

document.getElementById("questionImage")
.src = q.image;

}else{

document.getElementById("questionImage")
.style.display = "none";

}

document.getElementById("questionBox")
.innerHTML =
q.question;

const answersBox =
document.getElementById("answersBox");

answersBox.innerHTML = "";

q.answers.forEach((answer,index)=>{

let className = "answer";

if(index === q.correct){

className += " correct";

}

answersBox.innerHTML +=
`
<div class="${className}">
${answer}
</div>
`;

});

set(
ref(
db,
'rooms/' +
currentRoom +
'/game'
),
q
);

startTimer();

}

window.nextQuestion = function(){

currentQuestion++;

if(currentQuestion >= questions.length){

currentQuestion = 0;

}

showQuestion();

}

function listenResponses(code){

const responsesRef =
ref(db,'rooms/' + code + '/responses');

onValue(responsesRef,async(snapshot)=>{

const data = snapshot.val();

let total = 0;

if(data){

const playersSnap =
await get(
ref(db,'rooms/' + code + '/players')
);

const players =
playersSnap.val();

Object.values(data).forEach(response=>{

total++;

const q =
questions[currentQuestion];

if(response.answer === q.correct){

Object.entries(players).forEach(([id,player])=>{

if(player.name === response.player){

update(
ref(
db,
'rooms/' +
code +
'/players/' +
id
),
{
score:(player.score || 0) + 100
}
);

}

});

}

});

}

document.getElementById("responseCounter")
.innerHTML =
total + " respuestas";

});

}

function showLeaderboard(players){

const leaderboard =
document.getElementById("leaderboard");

leaderboard.innerHTML = "";

const sorted =
Object.values(players)
.sort((a,b)=>
(b.score || 0) - (a.score || 0)
);

sorted.slice(0,5).forEach((player,index)=>{

leaderboard.innerHTML +=
`
<div class="leader">

<div>
${index + 1}. 👤 ${player.name}
</div>

<div>
${player.score || 0} pts
</div>

</div>
`;

});

}

window.showPodium = function(){

const playersRef =
ref(db,'rooms/' + currentRoom + '/players');

get(playersRef).then((snapshot)=>{

const players = snapshot.val();

if(!players) return;

const sorted =
Object.values(players)
.sort((a,b)=>
(b.score || 0) - (a.score || 0)
);

document.getElementById("podium")
.style.display = "block";

podiumSound.play();

confetti({
particleCount:300,
spread:180
});

if(sorted[0]){

document.getElementById("firstName")
.innerHTML =
sorted[0].name;

document.getElementById("firstScore")
.innerHTML =
(sorted[0].score || 0) + " pts";

}

if(sorted[1]){

document.getElementById("secondName")
.innerHTML =
sorted[1].name;

document.getElementById("secondScore")
.innerHTML =
(sorted[1].score || 0) + " pts";

}

if(sorted[2]){

document.getElementById("thirdName")
.innerHTML =
sorted[2].name;

document.getElementById("thirdScore")
.innerHTML =
(sorted[2].score || 0) + " pts";

}

});

}

</script>

</body>

</html>
